name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify token secret
        env:
          STREAK_STATS_TOKEN: ${{ secrets.STREAK_STATS_TOKEN }}
        run: |
          if [ -z "$STREAK_STATS_TOKEN" ]; then
            echo "::error::STREAK_STATS_TOKEN is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&theme=dark&ring=B00020&fire=B00020&currStreakLabel=B00020&hide_border=true&background=151515&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push origin HEAD:main
